# Lint, test (Node 20, 22 and 24), build the demo, scan for secrets, then build and smoke-test the
# container. Pin actions to commit SHAs if your organization requires it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run data:check
      - run: npm test
      - run: npm run build
      # .npmrc disables install scripts, so the browser is installed explicitly.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0
      # Fails on any secret not already audited in .secrets.baseline (4 known false positives).
      - run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  container:
    runs-on: ubuntu-latest
    needs: [test, secrets]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oauth-field-guide:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name ofg -p 3000:3000 -e ALLOWED_HOSTS=localhost oauth-field-guide:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:3000/)" = "421"
          test "$(docker inspect --format '{{.Config.User}}' oauth-field-guide:ci)" = "node"
      - if: always()
        run: docker rm -f ofg || true
